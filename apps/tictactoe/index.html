<!doctype html>
<meta charset="utf-8">
<title>TicTacToe - laghu app</title>
<link rel="stylesheet" href="styles.css">
<style>ttt-board:not(:defined),ttt-score:not(:defined){visibility:hidden}</style>

<h1>TicTacToe</h1>

<ttt-board>
  <p id="status" data-bind="status">Turn: X</p>
  <div class="board">
    <template data-for="c, i in cells" data-key="id">
      <button class="cell" data-click="place" data-class:win="c.win" data-bind="c.v"></button>
    </template>
  </div>
  <p><button data-click="newRound">New round</button></p>
</ttt-board>

<ttt-score>
  <p id="score">X <span data-bind="score.X">0</span> - O <span data-bind="score.O">0</span> - draws <span data-bind="score.D">0</span></p>
  <p><button data-click="resetAll">Reset all</button></p>
</ttt-score>

<script src="../../dist/laghu.min.js"></script>
<script src="js/lib/game.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/components/ttt-board.js"></script>
<script src="js/components/ttt-score.js"></script>
