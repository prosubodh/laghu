<!doctype html>
<meta charset="utf-8" />
<title>laghu.js - fetch (JSON + HTML + morph)</title>
<div data-scope='{"user":null}'>
  <button data-get="/api/user" data-trigger="click queue:last" data-target="#out">Load JSON</button>
  <button data-get="/frag" data-target="#list" data-swap="morph:inner">Morph list</button>
  <div id="out"><span data-bind="user.name">-</span></div>
  <ul id="list">
    <li id="a">A</li>
  </ul>
</div>
<script src="../dist/laghu.min.js"></script>
<script src="../dist/morph.min.js"></script>
