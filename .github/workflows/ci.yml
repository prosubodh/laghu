name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref so only the latest commit is checked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # Report every platform's result instead of stopping at the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          # Cache the npm download directory; installs stay fast on all platforms.
          cache: npm

      # One install per platform: the former split into a separate governance
      # job, which duplicated setup and install for no extra coverage.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Size budgets
        run: npm run size

      - name: Test suites & coverage gate
        run: npm run test:coverage

      - name: Architectural boundaries
        run: node .agents/scripts/boundary_guard.js

      - name: Governance validation
        run: node scripts/validate-cli.js
